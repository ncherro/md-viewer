<!doctype html>
<html>
<head>
<meta charset="utf-8">
<base href="">
<meta name="color-scheme" content="light dark">
<style>
:root {
  /* Light: Rosé Pine Dawn */
  --fg: #575279;
  --fg-strong: #3f3b62;
  --fg-muted: #797593;
  --bg: #faf4ed;
  --bg-subtle: #f4ede8;
  --border: #dfdad9;
  --border-muted: #dfdad9b3;
  --link: #286983;
  --code-bg: #f2e9e1;
  --mark-bg: #ea9d3440;
  --blockquote: #797593;
  --accent: #d7827e;

  --syn-comment: #9893a5;
  --syn-keyword: #286983;
  --syn-string: #ea9d34;
  --syn-number: #907aa9;
  --syn-function: #d7827e;
  --syn-type: #56949f;
  --syn-variable: #907aa9;
  --syn-tag: #b4637a;
  --syn-meta: #b4637a;
}
@media (prefers-color-scheme: dark) {
  :root {
    /* Dark: One Dark Pro */
    --fg: #abb2bf;
    --fg-strong: #d7dae0;
    --fg-muted: #7f848e;
    --bg: #282c34;
    --bg-subtle: #21252b;
    --border: #3e4451;
    --border-muted: #3e4451b3;
    --link: #61afef;
    --code-bg: #3e4451;
    --mark-bg: #e5c07b40;
    --blockquote: #7f848e;
    --accent: #c678dd;

    --syn-comment: #7f848e;
    --syn-keyword: #c678dd;
    --syn-string: #98c379;
    --syn-number: #d19a66;
    --syn-function: #61afef;
    --syn-type: #e5c07b;
    --syn-variable: #e06c75;
    --syn-tag: #e06c75;
    --syn-meta: #56b6c2;
  }
}

/* Syntax highlighting (highlight.js classes), colored by the theme variables above */
.hljs { color: var(--fg); }
.hljs-comment, .hljs-quote { color: var(--syn-comment); font-style: italic; }
.hljs-keyword, .hljs-doctag, .hljs-formula, .hljs-selector-tag { color: var(--syn-keyword); }
.hljs-string, .hljs-regexp, .hljs-addition, .hljs-meta .hljs-string { color: var(--syn-string); }
.hljs-number, .hljs-literal, .hljs-symbol, .hljs-bullet { color: var(--syn-number); }
.hljs-title, .hljs-title.function_, .hljs-section { color: var(--syn-function); }
.hljs-type, .hljs-built_in, .hljs-title.class_, .hljs-class .hljs-title, .hljs-params { color: var(--syn-type); }
.hljs-variable, .hljs-template-variable, .hljs-attr, .hljs-property, .hljs-selector-class, .hljs-selector-id,
.hljs-selector-attr, .hljs-selector-pseudo { color: var(--syn-variable); }
.hljs-name, .hljs-tag, .hljs-deletion, .hljs-subst { color: var(--syn-tag); }
.hljs-meta, .hljs-attribute, .hljs-link { color: var(--syn-meta); }
.hljs-params { color: var(--fg); }
.hljs-emphasis { font-style: italic; }
.hljs-strong { font-weight: bold; }
.hljs-link { text-decoration: underline; }

html { background: var(--bg); }
body {
  margin: 0;
  padding: 32px 40px 64px;
  color: var(--fg);
  background: var(--bg);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  word-wrap: break-word;
}
#content { max-width: 880px; margin: 0 auto; }
#content > *:first-child { margin-top: 0 !important; }
#content > *:last-child { margin-bottom: 0 !important; }

a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }

h1, h2, h3, h4, h5, h6 { margin: 24px 0 16px; font-weight: 600; line-height: 1.25; color: var(--fg-strong); }
strong { color: var(--fg-strong); }
::selection { background: var(--border); }
input[type=checkbox] { accent-color: var(--accent); }
h1 { font-size: 2em; padding-bottom: .3em; border-bottom: 1px solid var(--border-muted); }
h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid var(--border-muted); }
h3 { font-size: 1.25em; }
h4 { font-size: 1em; }
h5 { font-size: .875em; }
h6 { font-size: .85em; color: var(--fg-muted); }

p, blockquote, ul, ol, dl, table, pre, details { margin: 0 0 16px; }
hr { height: .25em; padding: 0; margin: 24px 0; background: var(--border); border: 0; }

blockquote { padding: 0 1em; color: var(--blockquote); border-left: .25em solid var(--border); }
blockquote > :first-child { margin-top: 0; }
blockquote > :last-child { margin-bottom: 0; }

ul, ol { padding-left: 2em; }
li + li { margin-top: .25em; }
li > p { margin-top: 16px; }
ul ul, ul ol, ol ol, ol ul { margin-top: 0; margin-bottom: 0; }
li.task-list-item, ul > li:has(> input[type=checkbox]) { list-style: none; }
li > input[type=checkbox] { margin: 0 .35em .25em -1.4em; vertical-align: middle; }

code, kbd, pre, samp {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  font-size: 85%;
}
code {
  padding: .2em .4em;
  margin: 0;
  background: var(--code-bg);
  border-radius: 6px;
  white-space: break-spaces;
}
pre {
  padding: 16px;
  overflow: auto;
  line-height: 1.45;
  background: var(--bg-subtle);
  border-radius: 6px;
}
pre code {
  padding: 0;
  font-size: 100%;
  background: transparent;
  white-space: pre;
  border-radius: 0;
}
pre code.hljs { padding: 0; background: transparent; }
pre.front-matter { border: 1px dashed var(--border); }
kbd {
  display: inline-block;
  padding: 3px 5px;
  font-size: 11px;
  line-height: 10px;
  vertical-align: middle;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-bottom-color: var(--border);
  border-radius: 6px;
  box-shadow: inset 0 -1px 0 var(--border);
}

table { border-spacing: 0; border-collapse: collapse; display: block; width: max-content; max-width: 100%; overflow: auto; }
table th { font-weight: 600; }
table th, table td { padding: 6px 13px; border: 1px solid var(--border); }
table tr { background: var(--bg); border-top: 1px solid var(--border-muted); }
table tr:nth-child(2n) { background: var(--bg-subtle); }

img { max-width: 100%; box-sizing: content-box; background: transparent; }
mark { background: var(--mark-bg); color: inherit; }
del { color: var(--fg-muted); }

.footnotes { font-size: 12px; color: var(--fg-muted); border-top: 1px solid var(--border); margin-top: 32px; padding-top: 8px; }

/* Anchor link that appears on heading hover */
h1, h2, h3, h4, h5, h6 { position: relative; }
.anchor { position: absolute; right: 100%; padding-right: 6px; opacity: 0; color: var(--fg-muted); font-weight: 400; }
h1:hover .anchor, h2:hover .anchor, h3:hover .anchor, h4:hover .anchor, h5:hover .anchor, h6:hover .anchor { opacity: 1; text-decoration: none; }

/* GitHub's theme-specific image fragments */
@media (prefers-color-scheme: dark) { img[src$="#gh-light-mode-only"] { display: none; } }
@media not (prefers-color-scheme: dark) { img[src$="#gh-dark-mode-only"] { display: none; } }

.error { color: #d1242f; font-family: ui-monospace, Menlo, monospace; }

/* Mermaid diagrams render at natural size; wide ones scroll sideways rather than shrinking the text */
.mermaid-diagram { margin-bottom: 16px; overflow-x: auto; }
.mermaid-diagram svg { display: block; margin: 0 auto; }
.mermaid-diagram .error { margin: 0 0 8px; white-space: pre-wrap; }
</style>
<script>
/*HLJS_JS*/
</script>
<script>
(function () {
  function slugify(text) {
    return text.trim().toLowerCase()
      .replace(/[^\p{L}\p{N}\s_-]/gu, '')
      .replace(/\s/g, '-');
  }

  function addHeadingIds(root) {
    const seen = Object.create(null);
    root.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(function (h) {
      if (h.id) return;
      let slug = slugify(h.textContent) || 'section';
      if (seen[slug] !== undefined) { seen[slug] += 1; slug = slug + '-' + seen[slug]; }
      else { seen[slug] = 0; }
      h.id = slug;
      const a = document.createElement('a');
      a.className = 'anchor';
      a.href = '#' + slug;
      a.textContent = '#';
      a.setAttribute('aria-hidden', 'true');
      h.insertBefore(a, h.firstChild);
    });
  }

  function highlight(root) {
    if (!window.hljs) return;
    root.querySelectorAll('pre code').forEach(function (el) {
      const m = /language-([\w+#-]+)/.exec(el.className);
      if (!m || !hljs.getLanguage(m[1])) return; // only highlight when the language is known: fast + no bad guesses
      hljs.highlightElement(el);
    });
  }

  // Mermaid: ```mermaid blocks become diagrams, as on GitHub. The library is
  // ~5 MB, so it's loaded from the app bundle on first use rather than inlined.
  const MERMAID_URL = '/*MERMAID_URL*/';
  let mermaidLoading = null;
  let diagramSeq = 0;
  let renderPass = 0;
  const svgCache = new Map(); // theme + source → svg, so live reload doesn't flicker or jump

  function loadMermaid() {
    if (!mermaidLoading) {
      mermaidLoading = new Promise(function (resolve, reject) {
        const s = document.createElement('script');
        s.src = MERMAID_URL;
        s.onload = function () { resolve(window.mermaid); };
        s.onerror = function () { mermaidLoading = null; reject(new Error('Could not load ' + MERMAID_URL)); };
        document.head.appendChild(s);
      });
    }
    return mermaidLoading;
  }

  // Colors come from the page theme, so diagrams match Rosé Pine Dawn / One Dark Pro.
  function mermaidConfig() {
    const css = getComputedStyle(document.documentElement);
    const v = function (name) { return css.getPropertyValue(name).trim(); };
    return {
      startOnLoad: false,
      securityLevel: 'strict',
      suppressErrorRendering: true,
      theme: 'base',
      fontFamily: getComputedStyle(document.body).fontFamily,
      themeVariables: {
        darkMode: isDark(),
        background: v('--bg'),
        primaryColor: v('--code-bg'),
        primaryTextColor: v('--fg-strong'),
        primaryBorderColor: v('--border'),
        secondaryColor: v('--code-bg'),
        tertiaryColor: v('--bg'),
        lineColor: v('--fg-muted'),
        textColor: v('--fg'),
        clusterBkg: v('--bg-subtle'),
        clusterBorder: v('--border'),
        edgeLabelBackground: v('--bg'),
      },
    };
  }

  function isDark() { return window.matchMedia('(prefers-color-scheme: dark)').matches; }

  function showSvg(el, svg) {
    el.innerHTML = svg;
    // Natural size: mermaid's default width="100%" shrinks wide diagrams until the text is unreadable.
    const s = el.querySelector('svg');
    const box = s && s.viewBox && s.viewBox.baseVal;
    if (box && box.width) { s.style.maxWidth = 'none'; s.setAttribute('width', box.width); s.setAttribute('height', box.height); }
  }

  // Swaps each mermaid code block for a placeholder that keeps the source (shown until the
  // diagram renders, or if it fails). Cached diagrams go in straight away.
  function prepareDiagrams(root) {
    const theme = isDark() ? 'dark' : 'light';
    root.querySelectorAll('pre > code.language-mermaid').forEach(function (code) {
      const pre = code.parentNode;
      const div = document.createElement('div');
      div.className = 'mermaid-diagram';
      div.dataset.source = code.textContent;
      const cached = svgCache.get(theme + '\n' + div.dataset.source);
      if (cached) showSvg(div, cached);
      else div.appendChild(pre.cloneNode(true));
      pre.replaceWith(div);
    });
  }

  function renderDiagrams(root, force) {
    const blocks = Array.from(root.querySelectorAll('.mermaid-diagram'))
      .filter(function (el) { return force || !el.querySelector('svg'); });
    if (!blocks.length) return Promise.resolve();
    const pass = ++renderPass;
    return loadMermaid().then(async function (mermaid) {
      const theme = isDark() ? 'dark' : 'light';
      mermaid.initialize(mermaidConfig());
      for (const el of blocks) {
        if (pass !== renderPass) return; // newer content or theme arrived; that pass takes over
        const source = el.dataset.source;
        try {
          const result = await mermaid.render('mdv-mermaid-' + (++diagramSeq), source);
          if (pass !== renderPass) return;
          if (svgCache.size > 50) svgCache.clear();
          svgCache.set(theme + '\n' + source, result.svg);
          showSvg(el, result.svg);
        } catch (err) {
          const msg = document.createElement('pre');
          msg.className = 'error';
          msg.textContent = 'Mermaid: ' + ((err && err.message) || err);
          const src = document.createElement('pre');
          const code = document.createElement('code');
          code.textContent = source;
          src.appendChild(code);
          el.replaceChildren(msg, src);
        }
      }
    }).catch(function (err) {
      blocks.forEach(function (el) {
        if (el.querySelector('.error')) return;
        const msg = document.createElement('pre');
        msg.className = 'error';
        msg.textContent = String((err && err.message) || err);
        el.insertBefore(msg, el.firstChild);
      });
    });
  }

  function scrollToHash(hash) {
    if (!hash || hash === '#') { window.scrollTo(0, 0); return; }
    const id = decodeURIComponent(hash.slice(1));
    const el = document.getElementById(id) || document.getElementsByName(id)[0];
    if (el) el.scrollIntoView();
  }

  // GitHub-style image paths: `/x.png` is relative to the repo root, and
  // github.com/.../blob/... URLs point at an HTML page rather than the image.
  function fixImage(img, repoRoot) {
    const src = img.getAttribute('src') || '';
    const blob = /^https:\/\/github\.com\/([^/]+\/[^/]+)\/blob\/(.+)$/.exec(src);
    if (blob) { img.src = 'https://github.com/' + blob[1] + '/raw/' + blob[2]; return; }
    if (repoRoot && src.startsWith('/') && !src.startsWith('//')) {
      img.onerror = function () { img.onerror = null; img.src = 'file://' + src; }; // fall back to an absolute file path
      img.src = repoRoot + src.slice(1);
    }
  }

  // WebKit picks <picture> sources using the system theme, not the app's
  // Light/Dark override, so choose the source ourselves.
  function pickPictureSources(root, repoRoot) {
    root.querySelectorAll('picture').forEach(function (pic) {
      const img = pic.querySelector('img');
      if (!img) return;
      if (!img.dataset.fallback) img.dataset.fallback = img.getAttribute('src') || '';
      // Move srcset aside so WebKit doesn't override our choice.
      pic.querySelectorAll('source[srcset]').forEach(function (s) {
        s.dataset.srcset = s.getAttribute('srcset');
        s.removeAttribute('srcset');
      });
      let chosen = img.dataset.fallback;
      for (const source of pic.querySelectorAll('source[data-srcset]')) {
        if (!source.media || window.matchMedia(source.media).matches) {
          chosen = source.dataset.srcset.trim().split(/\s+/)[0];
          break;
        }
      }
      img.setAttribute('src', chosen);
      fixImage(img, repoRoot);
    });
  }

  let currentRepoRoot = '';
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
    const content = document.getElementById('content');
    pickPictureSources(content, currentRepoRoot);
    renderDiagrams(content, true);
  });

  window.mdv = {
    update: function (html, baseHref, repoRoot, hash) {
      document.querySelector('base').href = baseHref;
      const content = document.getElementById('content');
      const y = window.scrollY;
      const first = !content.hasChildNodes();
      content.innerHTML = html;
      currentRepoRoot = repoRoot;
      content.querySelectorAll('img').forEach(function (img) {
        if (!img.closest('picture')) fixImage(img, repoRoot);
      });
      pickPictureSources(content, repoRoot);
      addHeadingIds(content);
      prepareDiagrams(content);
      highlight(content);
      const restore = first && hash
        ? function () { scrollToHash(hash); }
        : function () { window.scrollTo(0, y); }; // keep position on live reload
      restore();
      // Diagrams change the page height once they render; restore again, but not if the user has scrolled since.
      const before = window.scrollY;
      renderDiagrams(content, false).then(function () { if (window.scrollY === before) restore(); });
    }
  };

  // In-page anchors: resolve against the page, not the <base> dir.
  document.addEventListener('click', function (e) {
    const a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a) return;
    e.preventDefault();
    scrollToHash(a.getAttribute('href'));
  });
})();
</script>
</head>
<body>
<article id="content"></article>
</body>
</html>
